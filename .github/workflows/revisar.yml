name: Revisar respostas do Telegram

on:
  schedule:
    - cron: "*/15 * * * *" # a cada 15 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revisar
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1" # mostra o log em tempo real
    steps:
      # Checagem rápida: se você não respondeu nada, para aqui (leva segundos)
      - name: Tem resposta nova?
        id: checar
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 -c "
          import json, os, urllib.request
          r = json.load(urllib.request.urlopen('https://api.telegram.org/bot' + os.environ['TOKEN'] + '/getUpdates?timeout=0'))
          print('tem=' + ('true' if r.get('result') else 'false'))
          " >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.checar.outputs.tem == 'true'

      - uses: actions/setup-python@v5
        if: steps.checar.outputs.tem == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg e fonte
        if: steps.checar.outputs.tem == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        if: steps.checar.outputs.tem == 'true'
        run: pip install -r requirements.txt faster-whisper

      - name: Cache do modelo Whisper
        if: steps.checar.outputs.tem == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base

      - name: Processar respostas
        if: steps.checar.outputs.tem == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: public
        run: python main.py revisar

      - name: Salvar regras e roteiros
        if: always() && steps.checar.outputs.tem == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898169+github-actions[bot]@users.noreply.github.com"
          git add -A estado 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Robô: revisão do Telegram"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
