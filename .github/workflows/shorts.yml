name: Postar Short

on:
  schedule:
    # Horário em UTC: 14h e 22h UTC = 11h e 19h em Brasília
    - cron: "0 08,19 * * *"
  workflow_dispatch: # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency: shorts

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg e fonte
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        run: pip install -r requirements.txt faster-whisper

      - name: Cache do modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base

      - name: Gerar e postar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: public
          VIDEOS_POR_EXECUCAO: "1"
        run: python main.py

      # O GitHub desliga agendamentos de repositório sem atividade há 60 dias.
      # Este commit automático mantém o repositório "ativo".
      - name: Manter o agendamento ativo
        if: always()
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > .github/ultima_execucao.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898169+github-actions[bot]@users.noreply.github.com"
          git add .github/ultima_execucao.txt
          git commit -m "Execução automática" || true
          git push || true
